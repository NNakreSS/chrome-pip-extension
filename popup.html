<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 220px;
            padding: 12px;
            margin: 0;
            background: #fff;
            color: #333;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            border-radius: 6px;
            background: #f0f0f0;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }
        button:last-child {
            margin-bottom: 0;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .primary {
            background: #007bff;
            color: white;
        }
        .primary:hover:not(:disabled) {
            background: #0056b3;
        }
        .danger {
            background: #dc3545;
            color: white;
        }
        .danger:hover:not(:disabled) {
            background: #c82333;
        }
        .success {
            background: #28a745;
            color: white;
        }
        .success:hover:not(:disabled) {
            background: #218838;
        }
        .header {
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="header">PiP Ayarları</div>
    <button id="togglePip" class="primary">Pop-out Yap</button>
    <button id="toggleSite" class="danger">Bu Sitede Kapat</button>
    <script src="popup.js"></script>
</body>
</html>
